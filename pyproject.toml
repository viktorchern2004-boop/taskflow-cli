[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taskflow-harness"
version = "0.1.0"
description = "TaskFlow Obsidian vault MCP connector"
requires-python = ">=3.11"
dependencies = ["mcp>=2.0,<3.0"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["mcp_vault*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
